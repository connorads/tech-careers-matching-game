            border: none;
            border-radius: 4px;

            justify-content: center;
            gap: 15px;
            margin-top: 15px;

            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;

            height: 8px;
            border-radius: 50%;
            background: #ccc;
            transition: background 0.3s;

                    {

                        content: "User researchers in the UK generally earn between £24k-£30k at entry level, with experienced roles paying around £40k-£50k. In London, mid-level positions often earn between £40k-£60k, while senior roles can reach £60k-£70k+."
                    },
                    {
                        title: "Why Should I Care?",
                        content: "If you're the friend who always questions why an app feels clunky or confusing, you're thinking like a user researcher. They ensure products are designed with real people in mind, gathering feedback to create experiences that truly work."
                    }
                ]
            },
            "Data Engineer": {
                title: "Data Engineer",
                facts: [
                    {
                        title: "Interesting Fact",
                        content: "In 2021, about 2.5 quintillion bytes of data were produced every day worldwide. Data engineers build the pipelines and databases to handle this flood of information - imagine stacking CDs so high they could rival the tallest skyscrapers."
                    },
                    {
                        title: "Example Career Path/Company",
                        content: "A data engineer might start as a SQL or ETL developer maintaining databases, before moving on to build data warehouses or big data platforms. In London, companies like Spotify rely on data engineers to manage song and user data, and banks hire them to process millions of transactions securely each day. Game companies also need data engineers to handle player stats and match results."
                    },
                    {
                        title: "Annual Salary Range",
                        content: "Data engineers in London typically earn around £65k per year on average, with mid-level roles between £60k-£80k. Entry-level positions can range from £35k-£45k, while senior data engineers or architects often earn between £90k-£100k+."
                    },
                    {
                        title: "Why Should I Care?",
                        content: "Think of data engineers as the plumbers for data. They build the pipelines that ensure information flows smoothly - whether it's for your Google searches or your Spotify Wrapped. If you enjoy organising complex systems, this role brings structure to the digital chaos."
                    }
                ]
            }
        };

        let selectedJobs = [];
        let titles = [];
        let descriptions = [];
        let selectedTitle = null;
        let selectedDescription = null;
        let matchedPairs = 0;

        const titlesList = document.getElementById('titles-list');
        const descriptionsList = document.getElementById('descriptions-list');
        const message = document.getElementById('message');
        const resetBtn = document.getElementById('reset-btn');

        // Shuffle function using Fisher-Yates algorithm
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Select 4 unique random jobs
        function selectRandomJobs() {
            const shuffled = shuffle([...jobsData]);
            selectedJobs = shuffled.slice(0, 4);
        }

        // Initialize the game
        function initGame() {
            // Reset variables
            selectRandomJobs();
            titles = shuffle([...selectedJobs]);
            descriptions = shuffle([...selectedJobs]);
            selectedTitle = null;
            selectedDescription = null;
            matchedPairs = 0;
            message.textContent = '';

            // Clear existing lists
            titlesList.innerHTML = '';
            descriptionsList.innerHTML = '';

            // Populate titles
            titles.forEach((job) => {
                const li = document.createElement('li');
                li.textContent = job["Job Title"];
                li.classList.add('list-item');
                li.dataset.title = job["Job Title"];
                li.setAttribute('tabindex', '0'); // Make focusable
                li.setAttribute('role', 'button');
                li.setAttribute('aria-pressed', 'false');
                li.addEventListener('click', selectTitle);
                // Add keypress event for Enter key
                li.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') selectTitle(e);
                });
                titlesList.appendChild(li);
            });

            // Populate descriptions
            descriptions.forEach((job) => {
                const li = document.createElement('li');
                li.textContent = job["Description"];
                li.classList.add('list-item');
                li.dataset.title = job["Job Title"];
                li.setAttribute('tabindex', '0'); // Make focusable
                li.setAttribute('role', 'button');
                li.setAttribute('aria-pressed', 'false');
                li.addEventListener('click', selectDescription);
                // Add keypress event for Enter key
                li.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') selectDescription(e);
                });
                descriptionsList.appendChild(li);
            });
        }

        // Handle title selection
        function selectTitle(e) {
            const clicked = e.target;
            if (clicked.classList.contains('matched') || clicked === selectedTitle) return;

            // Deselect previous selection
            if (selectedTitle) {
                selectedTitle.classList.remove('selected');
            }

            // Select new title
            selectedTitle = clicked;
            selectedTitle.classList.add('selected');

            // Attempt to check match if description is already selected
            if (selectedDescription) {
                checkMatch();
            }
        }

        // Handle description selection
        function selectDescription(e) {
            const clicked = e.target;
            if (clicked.classList.contains('matched') || clicked === selectedDescription) return;

            // Deselect previous selection
            if (selectedDescription) {
                selectedDescription.classList.remove('selected');
            }

            // Select new description
            selectedDescription = clicked;
            selectedDescription.classList.add('selected');

            // Attempt to check match if title is already selected
            if (selectedTitle) {
                checkMatch();
            }
        }

        // Add Confetti Celebration using canvas-confetti library
        function celebrateConfetti(isGameComplete = false) {
            if (isGameComplete) {
                // Super celebration for completing all matches
                const end = Date.now() + 750; // 0.75 seconds

                // Launch multiple confetti bursts
                const colors = ['#FF4081', '#FF6E40', '#FFEB3B', '#69F0AE', '#40C4FF', '#7C4DFF', '#FF80AB', '#B388FF'];

                (function frame() {
                    confetti({
                        particleCount: 100,
                        angle: 60,
                        spread: 75,
                        origin: { x: 0, y: 0.8 },
                        colors: colors
                    });
                    confetti({
                        particleCount: 100,
                        angle: 120,
                        spread: 75,
                        origin: { x: 1, y: 0.8 },
                        colors: colors
                    });
                    if (Date.now() < end) {
                        requestAnimationFrame(frame);
                    }
                }());
            } else {
                // Single burst for individual matches
                confetti({
                    particleCount: 100,
                    spread: 50,
                    origin: { y: 0.7 },
                    colors: ['#00796b', '#004d40', '#26a69a'],
                });
            }
        }

        // Check if selected title and description match
        function checkMatch() {
            const titleJobTitle = selectedTitle.dataset.title;
            const descriptionJobTitle = selectedDescription.dataset.title;

            if (titleJobTitle === descriptionJobTitle) {
                // Correct match
                selectedTitle.classList.add('matched');
                selectedDescription.classList.add('matched');
                matchedPairs++;
                message.textContent = `Good job! You have ${matchedPairs} out of 4 matches.`;

                // Celebrate individual match with confetti
                celebrateConfetti(false);

                // Show fact carousel
                showFactCarousel(titleJobTitle);

                // Reset selections
                selectedTitle = null;
                selectedDescription = null;

                // Check if game is complete
                if (matchedPairs === selectedJobs.length) {
                    message.textContent = "Congratulations! You've matched all the jobs correctly!";
                    // Super celebration for game completion
                    celebrateConfetti(true);
                }
            } else {
                // Incorrect match
                // Highlight the wrong selections in red
                selectedTitle.classList.add('wrong');
                selectedDescription.classList.add('wrong');
                message.textContent = "Oops! That's not a match. Try again.";

                setTimeout(() => {
                    // Remove the wrong highlight
                    selectedTitle.classList.remove('wrong');
                    selectedDescription.classList.remove('wrong');
                    // Also remove the selected class
                    selectedTitle.classList.remove('selected');
                    selectedDescription.classList.remove('selected');
                    // Reset selections
                    selectedTitle = null;
                    selectedDescription = null;
                }, 1000);
            }
        }

        // Add carousel functionality
        let currentFactIndex = 0;
        const carousel = document.querySelector('.fact-carousel');
        const factContent = carousel.querySelector('.fact-content');
        const prevButton = carousel.querySelector('.prev-fact');
        const nextButton = carousel.querySelector('.next-fact');
        const closeButton = carousel.querySelector('.close-carousel');
        const indicators = carousel.querySelector('.fact-indicators');
        let currentJobFacts = null; // Store current job facts reference

        function showFactCarousel(jobTitle) {
            const facts = detailedFacts[jobTitle];
            if (!facts) return;

            currentJobFacts = facts; // Store reference to current job facts
            currentFactIndex = 0;
            carousel.querySelector('h2').textContent = facts.title;

            // Create indicators
            indicators.innerHTML = facts.facts.map((_, index) =>
                `<div class="fact-indicator${index === 0 ? ' active' : ''}"></div>`
            ).join('');

            updateFactContent();
            carousel.classList.add('show');

            // Update button states
            updateNavButtons();
        }

        function updateFactContent() {
            if (!currentJobFacts) return;
            const fact = currentJobFacts.facts[currentFactIndex];
            factContent.innerHTML = `
                <h3>${fact.title}</h3>
                <p>${fact.content}</p>
            `;

            // Update indicators
            const allIndicators = indicators.querySelectorAll('.fact-indicator');
            allIndicators.forEach((indicator, index) => {
                indicator.classList.toggle('active', index === currentFactIndex);
            });
        }

        function updateNavButtons() {
            if (!currentJobFacts) return;
            prevButton.disabled = currentFactIndex === 0;
            
            // Update next button to show 'Done' on last fact
            if (currentFactIndex === currentJobFacts.facts.length - 1) {
                nextButton.textContent = 'Done';
                nextButton.disabled = false;
            } else {
                nextButton.textContent = 'Next';
                nextButton.disabled = false;
            }
        }

        prevButton.addEventListener('click', () => {
            if (!currentJobFacts || currentFactIndex <= 0) return;
            currentFactIndex--;
            updateFactContent();
            updateNavButtons();
        });

        nextButton.addEventListener('click', () => {
            if (!currentJobFacts) return;
            
            if (currentFactIndex >= currentJobFacts.facts.length - 1) {
                // If we're on the last fact, close the carousel
                carousel.classList.remove('show');
                currentJobFacts = null;
                return;
            }
            
            currentFactIndex++;
            updateFactContent();
            updateNavButtons();
        });

        closeButton.addEventListener('click', () => {
            carousel.classList.remove('show');
            currentJobFacts = null; // Clear current facts reference when closing
        });

        // Close carousel when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target === carousel) {
                carousel.classList.remove('show');
                currentJobFacts = null; // Clear current facts reference when closing
            }
        });

        // Close carousel with Escape key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && carousel.classList.contains('show')) {
                carousel.classList.remove('show');
                currentJobFacts = null; // Clear current facts reference when closing
            }
        });

        // Reset game on button click
        resetBtn.addEventListener('click', initGame);

        // Start the game on page load
        window.onload = initGame;
    </script>
</body>

</html>
